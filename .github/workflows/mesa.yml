name: Mesa de agentes

on:
  schedule:
    # Todos os dias às 08:30 UTC (09:30 em Lisboa no verão)
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: mesa

jobs:
  mesa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Reunir a mesa
        run: python mesa.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MESA_TICKER: ${{ vars.MESA_TICKER }}
          MESA_ISIN: ${{ vars.MESA_ISIN }}
          MESA_EXECUTAR: ${{ vars.MESA_EXECUTAR }}
          T212_KEY: ${{ secrets.T212_KEY }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
          T212_MODO: ${{ vars.T212_MODO }}

      - name: Avisar no telemóvel
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
        run: |
          [ -z "$NTFY_TOPICO" ] && exit 0
          if git diff --quiet -- historico.json; then export NOVO=0; else export NOVO=1; fi
          python - <<'PY' || true
          import datetime, json, os, requests
          from zoneinfo import ZoneInfo
          h = json.load(open("historico.json", encoding="utf-8"))[-1]
          nomes = {"grafico": "Gráfico", "noticias": "Notícias", "macro": "Macro",
                   "risco": "Risco", "diabo": "Advogado do diabo"}
          hist = json.load(open("historico.json", encoding="utf-8"))
          total = f"{sum(x.get('gasto') or 0 for x in hist):.2f} €".replace(".", ",")
          gasto = h.get("gasto") or 0
          hoje = datetime.datetime.now(ZoneInfo("Europe/Lisbon")).strftime("%d/%m")
          a, m, d = h["data"].split("-")
          if os.environ["NOVO"] == "0":
              titulo, prio, tags = "Mesa: sem análise nova hoje", 2, ["zzz"]
              linhas = [f"Hoje {hoje}: bolsa fechada ou ainda sem fecho novo.",
                        f"Última decisão (fecho {d}/{m}): {h['decisao']}",
                        f"Total comprado pela mesa: {total}"]
          else:
              if gasto:
                  titulo, prio, tags = f"Mesa comprou {gasto:.2f} €".replace(".", ","), 4, ["moneybag"]
              else:
                  titulo, prio, tags = f"Mesa: {h['decisao']}", 3, ["robot"]
              linhas = [f"Análise de {hoje} · último fecho {d}/{m}", h["regra"], ""]
              linhas += [f"{nomes.get(k, k)}: {v['voto']}" for k, v in h["votos"].items()]
              linhas += ["", f"Trading 212: {h.get('ordem', '—')}", f"Total comprado: {total}"]
          dono, nome = os.environ["GITHUB_REPOSITORY"].split("/")
          r = requests.post("https://ntfy.sh/", timeout=15, json={
              "topic": os.environ["NTFY_TOPICO"], "title": titulo,
              "message": "\n".join(linhas), "priority": prio, "tags": tags,
              "click": f"https://{dono}.github.io/{nome}/"})
          print("Aviso enviado:", r.status_code)
          PY

      - name: Guardar decisão e painel
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add historico.json docs/index.html
          git diff --staged --quiet || git commit -m "Mesa: análise de $(date +%F)"
          git push
