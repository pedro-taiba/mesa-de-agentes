name: Mesa de agentes

on:
  schedule:
    # Dias úteis às 08:30 UTC (09:30 em Lisboa no verão), com a bolsa alemã aberta
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency: mesa

jobs:
  mesa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Reunir a mesa
        run: python mesa.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MESA_TICKER: ${{ vars.MESA_TICKER }}
          MESA_ISIN: ${{ vars.MESA_ISIN }}
          MESA_EXECUTAR: ${{ vars.MESA_EXECUTAR }}
          T212_KEY: ${{ secrets.T212_KEY }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
          T212_MODO: ${{ vars.T212_MODO }}

      - name: Guardar decisão e painel
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add historico.json docs/index.html
          git diff --staged --quiet || git commit -m "Mesa: análise de $(date +%F)"
          git push
